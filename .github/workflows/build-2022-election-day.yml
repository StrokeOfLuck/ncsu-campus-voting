name: Build 2022 Election Day baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_2022_election_day.py'
      - '.github/workflows/build-2022-election-day.yml'

permissions:
  contents: write

concurrency:
  group: build-2022-baselines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Election Day aggregates
        run: python scripts/build_2022_election_day.py

      - name: Commit Election Day outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/election_day/
          if git diff --cached --quiet; then
            echo "No Election Day changes to commit."
          else
            git commit -m "Build 2022 Election Day baseline"
            git pull --rebase origin main
            git push
          fi

name: Build 2022 voting baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/download_2022.py'
      - '.github/workflows/build-2022-baseline.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official NCSBE file and create aggregate outputs
        run: python scripts/download_2022.py

      - name: Commit aggregate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          if git diff --cached --quiet; then
            echo "No processed-data changes to commit."
          else
            git commit -m "Build 2022 aggregate voting baseline"
            git push
          fi
